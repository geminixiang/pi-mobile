name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      - run: npm ci
      - run: npm run check

  windows-screen:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      - working-directory: host
        run: go test -run "InputRecord|TextRecords|Chord|Rune|Zpixmap|Crop|DesktopEnvironment|Batch|LoginShell" .
