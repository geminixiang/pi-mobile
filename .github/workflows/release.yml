name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
          [ -f "docs/releases/$version.md" ] || { echo "::error::missing docs/releases/$version.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run check

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.PI_MOBILE_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.PI_MOBILE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.PI_MOBILE_KEY_ALIAS }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] && [ -n "$ALIAS" ] || { echo "::error::release key secrets are not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "PI_MOBILE_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "PI_MOBILE_KEYSTORE_PASSWORD=$PASSWORD"
            echo "PI_MOBILE_KEY_ALIAS=$ALIAS"
          } > "$RUNNER_TEMP/release.env"

      - name: Build APK
        env:
          PI_MOBILE_RELEASE_ENV: ${{ runner.temp }}/release.env
        run: |
          scripts/release-android.sh
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "pi-mobile-$VERSION.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 > cert.sha256
          [ -s cert.sha256 ] || { echo "::error::no signing certificate in the APK"; exit 1; }

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/release.env"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            pi-mobile-${{ env.VERSION }}.apk
            cert.sha256

  computer:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      - name: Build
        working-directory: host
        run: |
          go vet ./...
          go test ./...
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}; arch=${target#*/}; name=$arch; [ "$arch" = amd64 ] && name=x64
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../pi-mobile-$os-$name" .
          done
          cp macos/pi-mobile.icns ../pi-mobile.icns

      - uses: actions/upload-artifact@v4
        with:
          name: computer
          path: |
            pi-mobile-darwin-*
            pi-mobile-linux-*
            pi-mobile.icns

  release:
    needs: [check, android, computer]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="pi-mobile-$VERSION.apk"
          sha256sum "$apk" pi-mobile-darwin-* pi-mobile-linux-* pi-mobile.icns > pi-mobile.sha256
          {
            cat "docs/releases/$VERSION.md"
            printf '\n## 驗證\n- APK SHA-256：`%s`\n- 簽章憑證 SHA-256：`%s`\n- 所有檔案的 SHA-256：`pi-mobile.sha256`\n' \
              "$(sha256sum "$apk" | cut -d' ' -f1)" "$(cat cert.sha256)"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" pi-mobile-darwin-* pi-mobile-linux-* pi-mobile.icns pi-mobile.sha256 \
            --title "pi mobile $VERSION" --notes-file notes.md --verify-tag --latest
