# pi-host for macOS and Linux, on arm64 and x64, whenever host/ changes on main: the binaries replace the assets of
# the prerelease tagged pi-host, where host/install.sh downloads them. A prerelease, so it is never the app's latest.
name: pi-host

on:
  push:
    branches: [main]
    paths: ["host/**", ".github/workflows/host.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-host

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      - name: Build
        working-directory: host
        run: |
          go vet ./...
          version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}; arch=${target#*/}; name=$arch; [ "$arch" = amd64 ] && name=x64
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../pi-host-$os-$name" .
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum pi-host-* > pi-host.sha256
          notes="pi-host $VERSION, built from ${GITHUB_SHA}. Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/host/install.sh | sh"
          if gh release view pi-host > /dev/null 2>&1; then
            gh release upload pi-host pi-host-* pi-host.sha256 --clobber
            gh release edit pi-host --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create pi-host pi-host-* pi-host.sha256 --prerelease --title "pi-host" --notes "$notes" --target "$GITHUB_SHA"
          fi
