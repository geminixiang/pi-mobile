[package]
name = "agentscreen"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
idevice = { path = "vendor/idevice/idevice", features = ["xctest", "remote_pairing", "installation_proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
plist = "1"
serde_json = "1"
