apply plugin: 'com.android.application'

android {
    namespace = "dev.geminixiang.pimobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.geminixiang.pimobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("PI_MOBILE_VERSION_CODE") ?: "1")
        versionName System.getenv("PI_MOBILE_VERSION_NAME") ?: "dev"
        ndk {
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        published {
            def keystore = System.getenv("PI_MOBILE_KEYSTORE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("PI_MOBILE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PI_MOBILE_KEY_ALIAS")
                keyPassword System.getenv("PI_MOBILE_KEYSTORE_PASSWORD")
            }
        }
        localDebugKey {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            signingConfig = System.getenv("PI_MOBILE_KEYSTORE") ? signingConfigs.published : signingConfigs.localDebugKey
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation "androidx.webkit:webkit:${rootProject.ext.androidxWebkitVersion}"
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.2"
    implementation "com.google.android.gms:play-services-location:21.4.0"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
