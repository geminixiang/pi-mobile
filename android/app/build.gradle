apply plugin: 'com.android.application'

android {
    namespace = "dev.geminixiang.pimobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.geminixiang.pimobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // From scripts/release-android.sh (package.json version); development builds stay at 1 / "dev".
        versionCode Integer.parseInt(System.getenv("PI_MOBILE_VERSION_CODE") ?: "1")
        versionName System.getenv("PI_MOBILE_VERSION_NAME") ?: "dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Only 64-bit ARM: current Android phones and the Apple-silicon emulator. Drops three copies of the SQLite native library.
        ndk {
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Published releases: a private key outside the repo (scripts/release-android.sh reads its env file).
        published {
            def keystore = System.getenv("PI_MOBILE_KEYSTORE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("PI_MOBILE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PI_MOBILE_KEY_ALIAS")
                keyPassword System.getenv("PI_MOBILE_KEYSTORE_PASSWORD")
            }
        }
        // Without the release key (scripts/build-android.sh): the local debug key. A build signed so cannot replace a
        // published release, nor be replaced by one, without uninstalling, which deletes the phone's data.
        sideload {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig System.getenv("PI_MOBILE_KEYSTORE") ? signingConfigs.published : signingConfigs.sideload
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // ML Kit through Google Play services (ScannerPlugin): the document scanner and Chinese text recognition, whose
    // models Play services downloads, so the app carries none.
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
